name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository. Dropping the
# default token permissions means a compromised step or action cannot use
# GITHUB_TOKEN to write to the repo, packages or releases.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the full commit SHA the v4 tag points to (not the
      # floating major tag), so a retagged or compromised upstream ref cannot
      # run arbitrary code in this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack reads the "packageManager" field in package.json and provides
      # the pinned pnpm version; it must be enabled before setup-node so the
      # pnpm store cache can resolve `pnpm store path`.
      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
